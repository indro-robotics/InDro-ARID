left_realsense/left_realsense_link:
  ros__parameters:
    enable_infra1: true
    enable_infra2: true
    enable_color: false
    enable_sync: false
    enable_depth: false
    depth_module:
      emitter_enabled: 0
      enable_auto_exposure: true
      profile: '640x360x60'   # not 90: the 90fps USB service interval stalls the bus
    rgb_camera:
      power_line_frequency: 1
    enable_gyro: false
    enable_accel: false
    initial_reset: false
    serial_no: ""               # left RS serial number (no leading underscore)
    camera_name: "left_realsense"
    use_intra_process_comms: true

front_realsense/front_realsense_link:
  ros__parameters:
    enable_infra1: true
    enable_infra2: true
    enable_color: false         # nothing on ARID subscribes RealSense colour
    enable_sync: false
    enable_depth: false
    depth_module:
      emitter_enabled: 0
      enable_auto_exposure: true
      profile: '640x360x60'
    rgb_camera:
      power_line_frequency: 1  # 60 Hz
    enable_gyro: false
    enable_accel: false
    initial_reset: false
    serial_no: ""               # front RS serial number (no leading underscore)
    camera_name: "front_realsense"
    use_intra_process_comms: true

right_realsense/right_realsense_link:
  ros__parameters:
    enable_infra1: true
    enable_infra2: true
    enable_color: false
    enable_sync: false
    enable_depth: false
    depth_module:
      emitter_enabled: 0
      enable_auto_exposure: true
      profile: '640x360x60'
    rgb_camera:
      power_line_frequency: 1
    enable_gyro: false
    enable_accel: false
    initial_reset: false
    serial_no: ""               # right RS serial number (no leading underscore)
    camera_name: "right_realsense"
    use_intra_process_comms: true

visual_slam_node:
  ros__parameters:
    sync_matching_threshold_ms: 15.0
    enable_image_denoising: false
    rectified_images: true
    enable_imu_fusion: false
    image_jitter_threshold_ms: 34.0
    map_frame: 'map'
    odom_frame: 'odom'
    base_frame: 'base_link'
    imu_frame: 'autopilot'
    enable_slam_visualization: false
    enable_landmarks_view: false
    enable_observations_view: false
    enable_localization_n_mapping: true
    num_cameras: 6
    # Applies only AFTER cuVSLAM init: init still needs one camera_info from all 6 streams.
    min_num_images: 4   # survives a FULL single-camera loss (2 stereo pairs keep VO alive, degraded); 5 only survives one dead stream
    stale_stream_timeout_ms: 100.0   # stamp-domain: a stream silent this long stops blocking set emission; 0 = stock stall-on-empty
    image_qos: "SENSOR_DATA"
    camera_optical_frames:
      - 'front_realsense_infra1_optical_frame'
      - 'front_realsense_infra2_optical_frame'
      - 'left_realsense_infra1_optical_frame'
      - 'left_realsense_infra2_optical_frame'
      - 'right_realsense_infra1_optical_frame'
      - 'right_realsense_infra2_optical_frame'
