front_realsense/front_realsense_link:
  ros__parameters:
    enable_infra1: true
    enable_infra2: true
    enable_color: false         # nothing subscribes RealSense colour on ARID
    enable_sync: false
    enable_depth: false
    depth_module:
      emitter_enabled: 0
      enable_auto_exposure: true
      profile: '640x360x60'
    rgb_camera:
      power_line_frequency: 1  # 60 Hz
    enable_gyro: false
    enable_accel: false
    initial_reset: false
    serial_no: ""               # front RS serial number (no leading underscore)
    camera_name: "front_realsense"
    use_intra_process_comms: true

visual_slam_node:
  ros__parameters:
    sync_matching_threshold_ms: 15.0
    enable_image_denoising: false
    rectified_images: true
    enable_imu_fusion: false
    image_jitter_threshold_ms: 34.0
    map_frame: 'map'
    odom_frame: 'odom'
    base_frame: 'base_link'
    imu_frame: 'autopilot'
    enable_slam_visualization: false   # nothing subscribes the vis topics; the LiDAR SDK shares this box
    enable_landmarks_view: false
    enable_observations_view: false
    enable_localization_n_mapping: true
    num_cameras: 2
    min_num_images: 2   # one camera = 2 infra streams, both required; no loss is survivable.
                        # Post-init only: cuVSLAM init still needs a camera_info from all num_cameras streams.
    stale_stream_timeout_ms: 100.0   # inert at one camera: dropping a stale stream leaves 1 < min 2, so no set emits either way
    image_qos: "SENSOR_DATA"
    camera_optical_frames:
      - 'front_realsense_infra1_optical_frame'
      - 'front_realsense_infra2_optical_frame'
