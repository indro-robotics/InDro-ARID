# Node Manager Pipeline Definitions
# Each entry creates a ROS2 service: /node_manager/<name>  (std_srvs/SetBool)
#   data: true  -> launch the command
#   data: false -> kill the process
#
# Add any ros2 launch / ros2 run command here and it will get its own service automatically.
#
# Optional per-pipeline topic monitoring:
#   monitor_topic: ROS2 topic to subscribe to for Hz measurement (e.g. camera_info)
#   min_hz:        Minimum message rate (Hz) required before alive=True is published.
#                  alive stays False until this threshold is met after the process starts.
#                  If omitted, alive=True is published immediately on process start.
#   restart_timeout: Seconds to wait for min_hz before auto-restarting the pipeline.
#                  Defaults to 10s if omitted.
#
# Service call examples:
#   ros2 service call /node_manager/down_cv_pipe  std_srvs/srv/SetBool "{data: true}"
#   ros2 service call /node_manager/down_cv_pipe  std_srvs/srv/SetBool "{data: false}"
#   ros2 service call /node_manager/front_cv_pipe std_srvs/srv/SetBool "{data: true}"
#   ros2 service call /node_manager/front_cv_pipe std_srvs/srv/SetBool "{data: false}"
#   ros2 service call /node_manager/stop_all      std_srvs/srv/Trigger

pipelines:

  front_cv_pipe:
    command: "ros2 launch realsense_cv_pipe realsense_cv_pipe.launch.py"
    monitor_topic: "/cam_front/heartbeat"   # std_msgs/Empty published by PipelineHeartbeatNode intra-process — proves full NITROS chain healthy
    min_hz: 2.0
    restart_timeout: 7.0                    # seconds to wait for Hz threshold before auto-restart

  down_cv_pipe:
    command: "ros2 launch cypher_argus cypher_argus.launch.py"
    monitor_topic: "/cam_down/heartbeat"    # std_msgs/Empty published by PipelineHeartbeatNode intra-process — proves full NITROS chain healthy
    min_hz: 2.0
    restart_timeout: 7.0                    # seconds to wait for Hz threshold before auto-restart
