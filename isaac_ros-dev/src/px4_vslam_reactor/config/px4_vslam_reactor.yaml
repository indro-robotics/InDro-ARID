# px4_vslam_reactor tunable parameters.
# Loaded by px4_vslam/launch/vslam.launch.py; applied to the vslam_reactor node. Defaults are
# also declared in the node, so it runs if this file is absent. Angular gates are entered in
# degrees here and converted to radians in the node.
/**:
  ros__parameters:

    vslam_stabilization_time: 1.0    # s, settle time before trusting a fresh VSLAM solution
    lin_vel_gate: 5.0                # m/s, reject odometry above this linear velocity (was 15.0 - too loose;
                                     #      analyzed flight peaked ~0.82 m/s, so 5.0 leaves headroom)
    ang_vel_gate_dps: 200.0          # deg/s, reject odometry above this angular velocity (was 900.0)
    VO_rate_lim: 0.5                 # s, min interval between set-pose corrections
    VO_pos_delta_lim: 0.4            # m, max position jump accepted in one correction
    sync_cache_sz: 300               # message_filters sync cache depth

    # Set-origin settle / alignment (dedicated; separate from the jump gate above).
    # After injecting the origin, keep injecting the stream (no re-seat) until EKF2 converges onto
    # it, then stream normally. "Aligned" = yaw error AND 3D position error both under tolerance.
    align_yaw_deg: 2.0               # deg, yaw-only tolerance to declare EKF2 settled onto the origin
    align_pos_m: 0.10                # m, 3D position tolerance to declare EKF2 settled onto the origin
    set_origin_settle_time: 10.0     # s, keep injecting this long for EKF2 to converge before re-injecting

    # Freshness gate for SetSlamPose: skip stale (pre-reboot) PX4 samples so a re-seat is never
    # anchored on FMU-down odometry. Caller retries each frame until a fresh sample arrives.
    set_pose_max_odom_age: 0.010     # s, max age of the cached PX4 odom sample used to seed a re-seat

    # FMU stamp skew clamp: if |now - FMU stamp| exceeds this, the map->px4 TF and
    # /reactor/drone_odom|drone_pose for that message are re-stamped with node time so uXRCE
    # timesync excursions cannot poison tf2 buffers. Skew-vs-now, not monotonicity: a future
    # rogue stamp is still monotonic. Normal-path stamps stay untouched.
    fmu_stamp_max_skew_s: 0.5        # s, max |now - FMU stamp| before re-stamping with node clock

    # Cadence-health gate: withhold VO from EKF2 while cuVSLAM frame cadence is broken
    # (camera-swap starvation makes smooth-but-stale poses that vo_state and the jump gate cannot
    # see; fusing them feeds a lag -> failover -> reset cascade). Scope: severity reduction for
    # degraded-cadence starvation BURSTS (stamp deltas are a lower bound on EKF2's arrival-silence
    # view; pure arrival stalls and total outages are handled by EKF2's own 400 ms de-latch +
    # clean re-anchor). Enforced in the fusion-active path for ALL settles (countdown pauses while
    # gated; no init bypass - the settle-timeout re-inject can fire mid-flight). Jump detection
    # stays live while gated (a genuine jump still re-seats + bumps the epoch); the withhold itself
    # never bumps the reset epoch. Stamp gaps > 5 s are treated as stamp anomalies (reseed, never
    # engage). Telemetry: /reactor/cadence_gate_count (engagements, latched) + /reactor/cadence_gated
    # (live state, latched).
    cadence_gate_s: 0.15             # s, VO header.stamp gap that engages (above benign-jitter p95; keep < 0.2 s EV_MAX_INTERVAL)
    cadence_release_samples: 5       # consecutive nominal-cadence samples to release (~55 ms at 90 Hz, ~165 ms at 30 Hz)
    set_pose_busy_timeout_s: 5.0     # s, clear vslam_busy if a SetSlamPose response never arrives (cuVSLAM died mid-call)
    # NO timed release: a degraded stream stays withheld until cadence proves nominal. EKF2 coasts
    # on flow+rng after its native 400 ms EV de-latch; if ALL horizontal aiding dies, PX4's own
    # ladder ends in failsafe. /reactor/cadence_gated latches True for the whole withhold so
    # prolonged gating is observable.
