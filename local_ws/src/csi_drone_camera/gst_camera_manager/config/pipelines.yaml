pipelines:
  phoenix_4k:
    # Auto-discovers first GigE Vision camera. Add camera-name="..." to pin a specific device.
    # Max sensor resolution: 4096x3000. GevSCPSPacketSize=8192 requires MTU 9000 on NIC.
    
    gst_pipeline: >-
      aravissrc
      exposure=10000
      features="AcquisitionMode=Continuous
                PixelFormat=Mono8
                GainAuto=Continuous
                AcquisitionFrameRateEnable=true
                AcquisitionFrameRate=5.0
                GevSCPSPacketSize=8192
                GevSCPD=0"
      ! video/x-raw,format=GRAY8,width=4096,height=3000,framerate=5/1
      ! appsink sync=false
    calibration: "phoenix_4k"
    topic: "scan_cam"
    frame_id: "scan_cam_frame"
    encoding: "mono8"
    compress: true
