# rs_driver configuration for the RSAIRY unit on this airframe.
# rslidar_coordinator passes the installed copy under share/ to rslidar_sdk_node as
# config_path, so an edit here takes effect only after colcon_local and a restart.

common:
  msg_source: 1                            # 1 = live LiDAR over UDP, 2 = RslidarPacket messages on
                                           # ros_recv_packet_topic, 3 = pcap replay. Any other value
                                           # aborts rslidar_sdk_node with exit -1.
  send_packet_ros: false
  send_point_cloud_ros: true

lidar:
  - driver:
      lidar_type: RSAIRY
      msop_port: 6699                      # Point-cloud (MSOP) packets. Must match the destination
                                           # port the sensor sends to; a mismatch is silent, the
                                           # socket never receives. Re-run config_lidar after a
                                           # LiDAR swap.
      difop_port: 7788                     # Device-info (DIFOP) packets; same matching requirement.
      imu_port: 6688                       # Socket is bound, nothing parses it: the SDK is built
                                           # with ENABLE_IMU_DATA_PARSE off.
      user_layer_bytes: 0                  # Bytes of vendor header prepended to each UDP payload;
                                           # the driver skips this many before the MSOP header.
      tail_layer_bytes: 0                  # Bytes of trailer appended to each UDP payload; the
                                           # driver discards this many from the end. A wrong value
                                           # on either key shifts the decode window and no packet
                                           # decodes at all.

      min_distance: 0.2                    # Metres. Returns outside [min, max] are dropped by the
      max_distance: 200                    # decoder. Whenever either is non-zero the pair replaces
                                           # the RSAIRY built-in range (0.1 to 60 m) outright, so 200
                                           # removes the far cutoff rather than extending the sensor.
                                           # One non-zero with the other left at 0 yields max 0 and
                                           # an empty cloud.
      use_lidar_clock: false               # false stamps clouds with host ROS time. true uses the
                                           # sensor's own clock, which counts from its boot unless it
                                           # is PTP-synced to the host; unsynced, the stamp lands far
                                           # outside the TF buffer and every lookup on the cloud fails.
      dense_points: true                   # true discards NaN returns and publishes height 1. false
                                           # keeps them and publishes the organized grid instead:
                                           # width = the channel count from the DIFOP model byte
                                           # (96 here), height = returns per channel.
      ts_first_point: false                # false stamps the cloud with the last point of the scan,
                                           # true with the first. The two differ by one scan duration.

      start_angle: 0                       # Degrees. Azimuth window the decoder keeps; returns
      end_angle: 360                       # outside it are dropped. Equal values modulo 360 disable
                                           # the filter, and start > end wraps the window through 0.

    ros:
      ros_frame_id: rslidar_link           # Must match the link name in the arid_description xacro
                                           # or the cloud cannot be transformed to base_link.
      ros_recv_packet_topic: /rslidar_packets    # Inert: msg_source 1 reads the socket, not a topic.
      ros_send_packet_topic: /rslidar_packets    # Inert while send_packet_ros is false.
      ros_send_imu_data_topic: /rslidar_imu_data # Inert: no IMU parser in this build.
      ros_send_point_cloud_topic: /rslidar_points
      ros_queue_length: 5                  # KeepLast depth of the SDK's publishers. The default QoS
                                           # is reliable, so a subscriber that falls behind makes the
                                           # publisher hold up to 5 clouds and drop the oldest beyond
                                           # that.
