common:
  msg_source: 1                            # 1 = online LiDAR over UDP
  send_packet_ros: false
  send_point_cloud_ros: true

lidar:
  - driver:
      lidar_type: RSAIRY
      msop_port: 6699                      # point-cloud
      difop_port: 7788                     # device info
      imu_port: 6688                       # socket bound only; ENABLE_IMU_DATA_PARSE off in SDK build
      user_layer_bytes: 0
      tail_layer_bytes: 0

      min_distance: 0.2
      max_distance: 200
      use_lidar_clock: true                # timestamps from LiDAR PTP clock
      dense_points: false                  # NaN points preserved (matches prior config)
      ts_first_point: true

      start_angle: 0
      end_angle: 360

    ros:
      ros_frame_id: rslidar_link           # matches xacro
      ros_recv_packet_topic: /rslidar_packets
      ros_send_packet_topic: /rslidar_packets
      ros_send_imu_data_topic: /rslidar_imu_data
      ros_send_point_cloud_topic: /rslidar_points
      ros_queue_length: 100
