common:
  msg_source: 1                            # 1: online LiDAR (UDP)
  send_packet_ros: false
  send_point_cloud_ros: true

lidar:
  - driver:
      lidar_type: RSAIRY
      msop_port: 6699                      # point-cloud packets
      difop_port: 7788                     # device info
      imu_port: 0                          # IMU parsing not compiled into rslidar_sdk; leave disabled
      user_layer_bytes: 0
      tail_layer_bytes: 0

      min_distance: 0.5
      max_distance: 20.0
      use_lidar_clock: true                # timestamps from LiDAR clock
      dense_points: true                   # strip NaN points at source
      ts_first_point: true

      start_angle: 0
      end_angle: 360

    ros:
      ros_frame_id: rslidar_link           # matches xacro frame
      ros_send_packet_topic: /rslidar_packets
      ros_send_point_cloud_topic: /rslidar_points
      ros_queue_length: 10
