# GstCameraManager pipeline definitions.
# Each entry spawns a gst_cam_node subprocess on demand and exposes a service at
# /gst_camera_manager/<name> (std_srvs/SetBool; true=start, false=stop).
#
# Fields (per pipeline):
#   gst_pipeline : Full GStreamer pipeline string, ending in `appsink`.
#   calibration  : Basename (no extension) of a YAML in config/calibrations/. If the
#                  file is missing or the field is omitted, camera_info is still
#                  published using defaults built from the first frame (zero
#                  distortion, fx=fy=width, principal point at image centre).
#   topic        : ROS topic root. Publishes /<topic>/image_raw, /<topic>/image_raw/compressed
#                  (when compress: true), and /<topic>/camera_info.
#   frame_id     : TF frame stamped into every image + camera_info header.
#   encoding     : Override for sensor_msgs/Image.encoding. Leave empty "" to let the
#                  node auto-detect from cv::Mat::type() (maps CV_8UC1→mono8, CV_8UC3→bgr8,
#                  CV_8UC4→bgra8, CV_16UC1→mono16, CV_16UC3→bgr16, CV_16UC4→bgra16).
#                  Set explicitly (e.g. "rgb8", "bayer_rggb8") to override auto-detect.
#   compress     : true → publishes both raw + compressed via image_transport (lazy, no
#                  cost if nothing subscribes to compressed). false → raw only.
#   alive_threshold : Seconds (float) without a camera_info message before the pipeline
#                     is marked not-alive on /gst_camera_manager/<name>/alive. Process
#                     death always forces alive=false regardless of this value. Timer
#                     starts when the subprocess is launched (acts as a startup grace
#                     period). Omitted → defaults to 5.0s.
#   reliable     : QoS for image_raw + camera_info. Default (omitted / "" / false) is
#                  sensor_data QoS (BEST_EFFORT, VOLATILE, depth 5): standard for image
#                  streams, drops frames over lossy links rather than stalling the
#                  publisher. Set `reliable: true` for streams that cannot tolerate frame
#                  drops (low-rate scanners, metadata-critical pipelines).

pipelines:

  cam_down:
    # IMX477 down camera, centre-cropped to a 1080x1080 square by the VIC with no scaling.
    # The crop is left=420 right=1500 top=0 bottom=1080 out of the 1920x1080 sensor mode,
    # which is what IMX477_1080sq.yaml is derived for. ee-mode=0 leaves the frame unsharpened.
    gst_pipeline:
      nvarguscamerasrc sensor-id=0 wbmode=1 aelock=false ee-mode=0 tnr-mode=2
      ! video/x-raw(memory:NVMM),width=1920,height=1080,framerate=15/1,format=NV12
      ! nvvidconv flip-method=0 left=420 right=1500 top=0 bottom=1080
      ! video/x-raw,format=GRAY8,width=1080,height=1080
      ! appsink sync=false
    calibration: "IMX477_1080sq"
    topic: "cam_down"
    frame_id: "bottom_visual_link"
    encoding: ""
    compress: true
    # 5.0, not 2.0: this value doubles as the startup grace period, and a cold Argus open on the
    # IMX477 takes just over 2 s to deliver its first frame - measured at 2.04 s, which tripped
    # the old threshold on literally every launch ("stalled ... frames resumed" one line later).
    # The false alarm also made verify_cv_cams give up on a camera that was working. At 15 fps a
    # real stall is still caught inside 5 s (~75 missed frames), so nothing is lost by waiting.
    alive_threshold: 5.0
